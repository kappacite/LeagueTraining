title: "Ils achètent de la résistance magique"
context: >
  Tu es Viktor. Trois ennemis ont acheté de la résistance magique contre toi, tes sorts font beaucoup
  moins de dégâts qu'au début de la partie. Tu as 1400 PO, ton 2e objet est terminé.
