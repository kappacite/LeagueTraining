choices:
  - id: a
    text: "Baguette explosive vers le Bâton du vide"
    items: [1026]
    grade: excellent
    explanation: >
      Le Bâton du vide donne de la pénétration magique en pourcentage : il est d'autant plus efficace que la
      cible a beaucoup de résistance magique. Contre trois ennemis qui en empilent, c'est l'objet qui rend tes
      sorts à nouveau dangereux.
  - id: b
    text: "Chapitre perdu pour plus de mana"
    items: [3802]
    grade: erreur
    explanation: >
      Le mana n'est pas ton problème : tes sorts touchent, mais ils sont absorbés par la résistance magique.
  - id: c
    text: "Baguette trop grosse pour plus de puissance"
    items: [1058]
    grade: correct
    explanation: >
      Plus de puissance augmente un peu tes dégâts, mais beaucoup moins qu'ignorer une partie de la résistance
      magique ennemie. La pénétration est la priorité ici.
lesson: "Quand l'ennemi empile la résistance magique, la pénétration magique vaut plus que la puissance."
