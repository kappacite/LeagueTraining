id: mid-roam-timing
type: decision
role: mid
difficulty: difficile
patch: "16.22.1"
title: "Le moment du roam"
context: >
  9:20. Le support adverse est en bot à 30 % de PV, leur ADC n'a pas de Saut éclair. Ta vague est au milieu
  de la lane, la vague suivante est à 15 s. Ton adversaire Orianna est à 80 % PV et a tous ses sorts.
  Ton jungler est près de ton buff rouge, côté bot.
me: { champion: Talon, hp: 85, mana: 70, gold: 650, summoners: [SummonerFlash, SummonerDot], items: [1055, 3134] }
time_limit: 25
scene:
  champions:
    - { champion: Talon, team: ally, x: 50, y: 50, me: true }
    - { champion: Orianna, team: enemy, x: 55, y: 45 }
    - { champion: Viego, team: ally, x: 52, y: 74 }
    - { champion: Jinx, team: ally, x: 80, y: 90 }
    - { champion: Thresh, team: ally, x: 78, y: 88 }
    - { champion: Kaisa, team: enemy, x: 86, y: 86 }
    - { champion: Nautilus, team: enemy, x: 88, y: 84 }
  wards: [ { team: ally, x: 64, y: 62 } ]
  objectives: []
choices:
  - id: a
    text: "Partir en roam tout de suite"
    grade: correct
    explanation: >
      La cible est bonne, mais ta vague reste au milieu : elle va arriver chez toi et Orianna peut la pousser
      dans ta tour ou te suivre. Tu perds beaucoup de sbires si le roam échoue.
  - id: b
    text: "Pousser ta vague jusqu'à sa tour, puis partir en roam bot"
    grade: excellent
    explanation: >
      Une vague poussée dans sa tour oblige Orianna à la farmer : elle ne peut pas te suivre sans perdre de l'or.
      Tu pars avec 15 à 20 s d'avance, ton jungler est déjà à côté, et la cible bot est faible. C'est le
      bon ordre : d'abord la vague, ensuite le roam.
  - id: c
    text: "Rester mid et jouer la lane"
    grade: erreur
    explanation: >
      Talon est un champion de roam, et une occasion à 2 contre 2 avec ton jungler et une cible à 30 % de PV
      est exactement ce qu'il doit jouer. Rester mid gaspille ton avantage.
lesson: "Avant un roam, pousse ta vague : ton adversaire doit choisir entre te suivre et perdre son farm."
