id: jungle-which-gank
type: decision
role: jungle
difficulty: facile
patch: "16.22.1"
title: "Quelle lane ganker ?"
context: >
  5:30. Tu viens de finir ton camp de loups. Au mid, Syndra a poussé sa vague jusqu'à ta tour
  et n'a pas sa Saut éclair (utilisée il y a 1 min). En bot, les deux lanes sont à égalité,
  la vague est au milieu et l'adversaire a ses deux Sauts éclairs.
me: { champion: JarvanIV, hp: 85, mana: 70, gold: 400, summoners: [SummonerFlash, SummonerSmite], items: [1036] }
time_limit: 15
scene:
  champions:
    - { champion: JarvanIV, team: ally, x: 28, y: 58, me: true }
    - { champion: Ahri, team: ally, x: 42, y: 60 }
    - { champion: Syndra, team: enemy, x: 46, y: 54 }
    - { champion: Jinx, team: ally, x: 52, y: 92 }
    - { champion: Thresh, team: ally, x: 50, y: 90 }
    - { champion: Kaisa, team: enemy, x: 56, y: 92 }
    - { champion: Nautilus, team: enemy, x: 58, y: 90 }
  wards: [ { team: enemy, x: 62, y: 74 } ]
  objectives: []
choices:
  - id: a
    text: "Ganker le mid"
    grade: excellent
    explanation: >
      Syndra est poussée loin de sa tour, sans Saut éclair, et tu es à côté. Toutes les conditions d'un bon gank
      sont réunies : distance, sort clé indisponible, et ton mid peut suivre.
  - id: b
    text: "Ganker le bot"
    grade: erreur
    explanation: >
      La vague est au milieu, les deux adversaires ont leur Saut éclair, et une balise ennemie surveille la rivière bot.
      Le gank a peu de chances de réussir et te fait traverser la carte.
  - id: c
    text: "Continuer à farmer ta jungle"
    grade: correct
    explanation: >
      Pas une erreur grave, mais une occasion de gank presque gratuite ne revient pas souvent.
      Le farm sera encore là après.
lesson: "Gank la lane où l'adversaire est poussé et n'a pas son Saut éclair."
