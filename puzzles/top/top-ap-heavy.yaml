choices:
  - id: a
    text: "Sandales de Mercure (à la place des Jambières du berzerker)"
    items: [3111]
    grade: correct
    explanation: >
      Résistance magique et réduction de la durée des contrôles, utile contre Lux et Syndra. Mais revendre
      tes bottes te coûte de l'or : c'est bien, pas optimal.
  - id: b
    text: "Manteau de Négatron, vers la Force de la nature"
    items: [1057]
    grade: excellent
    explanation: >
      Tu commences l'objet de résistance magique le plus adapté contre plusieurs sources de dégâts magiques
      soutenus. Garen doit aller au contact : il doit survivre aux sorts pour y arriver.
  - id: c
    text: "Pioche pour plus de dégâts"
    items: [1037]
    grade: erreur
    explanation: >
      Plus de dégâts ne servent à rien si tu meurs avant d'atteindre les carrys. Avec 4 champions AP,
      chaque point de résistance magique vaut plus que des dégâts.
lesson: "Quand une équipe est presque entièrement AP, la résistance magique passe avant les dégâts pour un bruiser."
