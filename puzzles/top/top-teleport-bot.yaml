  objectives: [ { type: dragon } ]
choices:
  - id: a
    text: "Téléporter sur la balise derrière le drake"
    grade: excellent
    explanation: >
      Ta vague est écrasée sur sa tour, donc tu ne perds presque rien en partant. Le top adverse n'a pas de
      téléportation : tu transformes un 4 contre 4 en 5 contre 4, et la balise derrière le drake te fait
      arriver dans le dos des ennemis, sur leur carry. C'est le meilleur usage possible de la téléportation.
  - id: b
    text: "Rester et taper la tour pendant que l'équipe se bat"
    grade: erreur
    explanation: >
      Quelques golds de plaques contre un drake et un fight à 5 contre 4 : l'échange est très mauvais.
      Si ton équipe perd, tu auras une plaque et l'adversaire aura le drake et des kills.
  - id: c
    text: "Téléporter sur la tour bot, plus sûre"
    grade: correct
    explanation: >
      Tu rejoins le fight, mais par devant et de plus loin : tu arrives plus tard et tu engages de face.
      La balise derrière le drake te donne un bien meilleur angle.
lesson: "La téléportation la plus forte arrive dans le dos de l'ennemi, quand ta vague ne craint rien."
