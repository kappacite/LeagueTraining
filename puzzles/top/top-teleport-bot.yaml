id: top-teleport-bot
type: decision
role: top
difficulty: moyen
patch: "16.22.1"
title: "Un fight démarre au drake"
context: >
  15:30. Ton équipe se bat au drake, à 4 contre 4 : le top adverse est en lane face à toi, sans téléportation.
  Ta vague vient de s'écraser sur sa tour, il a 50 % de PV. Tu as la téléportation, et une balise de ton
  support est posée derrière le drake.
me: { champion: Ornn, hp: 80, mana: 60, gold: 600, summoners: [SummonerFlash, SummonerTeleport], items: [3047, 3068] }
time_limit: 20
scene:
  champions:
    - { champion: Ornn, team: ally, x: 9, y: 30, me: true }
    - { champion: Renekton, team: enemy, x: 10, y: 18 }
    - { champion: Jinx, team: ally, x: 64, y: 78 }
    - { champion: Thresh, team: ally, x: 62, y: 74 }
    - { champion: Viego, team: ally, x: 60, y: 68 }
    - { champion: Ahri, team: ally, x: 58, y: 64 }
    - { champion: Kaisa, team: enemy, x: 72, y: 66 }
    - { champion: Nautilus, team: enemy, x: 70, y: 64 }
    - { champion: Khazix, team: enemy, x: 74, y: 70 }
    - { champion: Syndra, team: enemy, x: 72, y: 60 }
