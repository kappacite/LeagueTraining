title: "Aatrox se soigne trop"
context: >
  Tu es Malphite, ton adversaire Aatrox gagne tous les échanges grâce à ses soins.
  Tu reviens en base avec 900 PO.
me: { champion: Malphite, level: 7, gold: 900, items: [1054, 3047] }
allies: [Viego, Ahri, Jinx, Thresh]
enemies:
  - { champion: Aatrox, items: [1055, 3071] }
  - { champion: Vi }
  - { champion: Syndra }
  - { champion: Kaisa }
  - { champion: Soraka }
choices:
  - id: a
    text: "Armure roncière"
    items: [3076]
    grade: excellent
    explanation: >
      De l'armure contre un champion AD et un effet anti-soin à chaque fois qu'Aatrox te frappe.
      Elle évolue plus tard en Cotte épineuse. C'est l'achat qui règle le problème de la lane.
  - id: b
    text: "Gemme exaltante"
    items: [3067]
    grade: erreur
    explanation: >
      Des PV et de la réduction de temps de recharge, mais rien contre les soins ni contre les dégâts
      physiques d'Aatrox. Tu continueras de perdre les échanges.
  - id: c
    text: "Cotte de mailles"
    items: [1031]
    grade: correct
    explanation: >
      Plus d'armure brute, donc tu tiens mieux, mais Aatrox garde tous ses soins. Avec Soraka en face aussi,
      l'anti-soin est indispensable.
lesson: "Contre un adversaire qui se soigne, ton premier objet défensif doit appliquer l'anti-soin."
