patch: "16.22.1"
title: "Retour de base à 8 minutes"
context: >
  8:10. Tu reviens de la base avec une balise de contrôle. Ta vague bot est poussée vers la tour adverse,
  ton ADC peut la farmer sous sa tour en sécurité. Au mid, Syndra a poussé sa vague jusqu'à ta tour
  et n'a pas sa Saut éclair.
me: { champion: Rakan, hp: 100, mana: 100, gold: 150, summoners: [SummonerFlash, SummonerDot], items: [3877, 3158, 2055] }
time_limit: 20
scene:
  champions:
    - { champion: Rakan, team: ally, x: 32, y: 72, me: true }
    - { champion: Ahri, team: ally, x: 42, y: 60 }
    - { champion: Syndra, team: enemy, x: 46, y: 54 }
    - { champion: Jinx, team: ally, x: 78, y: 92 }
