choices:
  - id: a
    text: "Passer par le mid pour attaquer Syndra avec ton mid laner"
    grade: excellent
    explanation: >
      Ton bot ne risque rien (vague poussée, sous la tour adverse), et ton chemin vers le bot passe juste
      à côté du mid. Syndra est poussée et sans Saut éclair : c'est une cible facile pour un engagement de Rakan.
  - id: b
    text: "Retourner directement en bot"
    grade: correct
    explanation: >
      Sûr, mais tu laisses passer une occasion presque gratuite sur ton chemin. Ton ADC n'a pas besoin de toi
      pendant les 20 prochaines secondes.
  - id: c
    text: "Aller warder la jungle adverse côté top"
    grade: erreur
    explanation: >
      C'est loin de ton ADC et de toute action utile. La vision est importante, mais ici une occasion de
      kill est sur ton chemin.
lesson: "Après un back, regarde si une occasion se présente sur ton chemin avant de retourner en lane."
